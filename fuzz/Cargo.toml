[package]
name = "rsipclient-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
rsipclient = { path = ".." }

# Keep the fuzz crate out of the main workspace.
[workspace]
members = ["."]

[[bin]]
name = "sip_message"
path = "fuzz_targets/sip_message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sdp"
path = "fuzz_targets/sdp.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rtp_packet"
path = "fuzz_targets/rtp_packet.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wav"
path = "fuzz_targets/wav.rs"
test = false
doc = false
bench = false

[[bin]]
name = "stream_framing"
path = "fuzz_targets/stream_framing.rs"
test = false
doc = false
bench = false
